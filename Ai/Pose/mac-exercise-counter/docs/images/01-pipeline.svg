<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="1600" height="900" fill="#0b121d"/>
    <g font-family="Apple SD Gothic Neo">
    <text x="64" y="59" fill="#78e5b1" font-size="20" font-weight="700">LOCAL MOTION  /  IMPLEMENTATION</text>
    <text x="64" y="128" fill="#edf3fb" font-size="48" font-weight="700">카메라에서 횟수까지, 모두 Mac 안에서</text><text x="64" y="177" fill="#a5b7cd" font-size="24" font-weight="400">운동 종류는 사용자가 선택하고, 모델의 관절 출력을 자체 카운터에 연결합니다.</text>
    <rect x="64" y="245" width="232" height="238" rx="20" fill="#142337"/><text x="86" y="291" fill="#78e5b1" font-size="24" font-weight="700">01</text><text x="86" y="346" fill="#edf3fb" font-size="32" font-weight="700">입력</text><text x="86" y="402" fill="#a5b7cd" font-size="20" font-weight="400">카메라 / 로컬 영상</text><text x="86" y="436" fill="#a5b7cd" font-size="20" font-weight="400">OpenCV</text><text x="298" y="368" fill="#78e5b1" font-size="28" font-weight="400">›</text><rect x="312" y="245" width="232" height="238" rx="20" fill="#142337"/><text x="334" y="291" fill="#78e5b1" font-size="24" font-weight="700">02</text><text x="334" y="346" fill="#edf3fb" font-size="32" font-weight="700">사람 영역</text><text x="334" y="402" fill="#a5b7cd" font-size="20" font-weight="400">YOLOX-tiny</text><text x="334" y="436" fill="#a5b7cd" font-size="20" font-weight="400">선택 대상 추적</text><text x="546" y="368" fill="#78e5b1" font-size="28" font-weight="400">›</text><rect x="560" y="245" width="232" height="238" rx="20" fill="#142337"/><text x="582" y="291" fill="#78e5b1" font-size="24" font-weight="700">03</text><text x="582" y="346" fill="#edf3fb" font-size="32" font-weight="700">관절 추정</text><text x="582" y="402" fill="#a5b7cd" font-size="20" font-weight="400">RTMPose-L</text><text x="582" y="436" fill="#a5b7cd" font-size="20" font-weight="400">17개 관절 + 신뢰도</text><text x="794" y="368" fill="#78e5b1" font-size="28" font-weight="400">›</text><rect x="808" y="245" width="232" height="238" rx="20" fill="#142337"/><text x="830" y="291" fill="#78e5b1" font-size="24" font-weight="700">04</text><text x="830" y="346" fill="#edf3fb" font-size="32" font-weight="700">관측 검사</text><text x="830" y="402" fill="#a5b7cd" font-size="20" font-weight="400">운동별 필수 관절</text><text x="830" y="436" fill="#a5b7cd" font-size="20" font-weight="400">경계 검사 · 평활화</text><text x="1042" y="368" fill="#78e5b1" font-size="28" font-weight="400">›</text><rect x="1056" y="245" width="232" height="238" rx="20" fill="#142337"/><text x="1078" y="291" fill="#78e5b1" font-size="24" font-weight="700">05</text><text x="1078" y="346" fill="#edf3fb" font-size="32" font-weight="700">반복 판정</text><text x="1078" y="402" fill="#a5b7cd" font-size="20" font-weight="400">각도 · 이동량</text><text x="1078" y="436" fill="#a5b7cd" font-size="20" font-weight="400">시간 기반 상태 머신</text><text x="1290" y="368" fill="#78e5b1" font-size="28" font-weight="400">›</text><rect x="1304" y="245" width="232" height="238" rx="20" fill="#142337"/><text x="1326" y="291" fill="#78e5b1" font-size="24" font-weight="700">06</text><text x="1326" y="346" fill="#edf3fb" font-size="32" font-weight="700">화면 표시</text><text x="1326" y="402" fill="#a5b7cd" font-size="20" font-weight="400">횟수 · 상태 · FPS</text><text x="1326" y="436" fill="#a5b7cd" font-size="20" font-weight="400">PySide6</text><rect x="64" y="530" width="722" height="225" rx="20" fill="#142337"/><text x="92" y="578" fill="#78e5b1" font-size="29" font-weight="700">추가 학습 없이 기존 모델 활용</text><text x="92" y="627" fill="#edf3fb" font-size="24" font-weight="400">공식 ONNX 가중치 + rtmlib 전·후처리</text><text x="92" y="669" fill="#edf3fb" font-size="24" font-weight="400">ONNX Runtime에서 CoreML + CPU 실행</text><text x="92" y="711" fill="#edf3fb" font-size="24" font-weight="400">사용자가 지정한 영역은 기존 pose 모델에 직접 입력</text><rect x="810" y="530" width="726" height="225" rx="20" fill="#142337"/><text x="838" y="578" fill="#83baff" font-size="29" font-weight="700">앱에서 직접 구현한 처리</text><text x="838" y="627" fill="#edf3fb" font-size="24" font-weight="400">대상 고정 · 부분 촬영 · 중복 박스 확인</text><text x="838" y="669" fill="#edf3fb" font-size="24" font-weight="400">카메라는 최신 프레임 한 개를 처리</text><text x="838" y="711" fill="#edf3fb" font-size="24" font-weight="400">카운팅 안정화 · 누락 관절 안내 · 진단 화면</text><line x1="64" y1="818" x2="1536" y2="818" stroke="#2b3e54" stroke-width="1" stroke-linecap="round"/>
    <text x="64" y="855" fill="#a5b7cd" font-size="19" font-weight="400">근거: runtime.py · pipeline.py · counter.py · tracking.py · worker.py</text><text x="1420" y="855" fill="#a5b7cd" font-size="19" font-weight="400">2026.11.11</text>
    </g></svg>