<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="1600" height="900" fill="#0b121d"/>
    <g font-family="Apple SD Gothic Neo">
    <text x="64" y="59" fill="#78e5b1" font-size="20" font-weight="700">LOCAL MOTION  /  IMPLEMENTATION</text>
    <text x="64" y="128" fill="#edf3fb" font-size="48" font-weight="700">실제 측정한 화면 갱신 속도</text><text x="64" y="177" fill="#a5b7cd" font-size="24" font-weight="400">추론 단독 속도와 입력·추론·화면 표시를 포함한 앱 성능을 혼동하지 않습니다.</text>
    <rect x="64" y="235" width="718" height="325" rx="20" fill="#142337"/><rect x="808" y="235" width="728" height="325" rx="20" fill="#142337"/><text x="94" y="288" fill="#edf3fb" font-size="30" font-weight="700">한쪽 다리 스쿼트 파일 재생</text><text x="94" y="402" fill="#78e5b1" font-size="76" font-weight="700">23.08 FPS</text><text x="94" y="468" fill="#a5b7cd" font-size="25" font-weight="400">528 × 1076 · 입력 25FPS · 313프레임</text><text x="94" y="510" fill="#a5b7cd" font-size="25" font-weight="400">실제 macOS 앱 화면 갱신 평균</text><text x="838" y="288" fill="#edf3fb" font-size="30" font-weight="700">상체 팔굽혀펴기 파일 재생</text><text x="838" y="402" fill="#78e5b1" font-size="76" font-weight="700">27.21 FPS</text><text x="838" y="468" fill="#a5b7cd" font-size="25" font-weight="400">1280 × 986 · 입력 약 29.97FPS · 718프레임</text><text x="838" y="510" fill="#a5b7cd" font-size="25" font-weight="400">실제 macOS 앱 화면 갱신 평균</text><rect x="64" y="595" width="1472" height="181" rx="20" fill="#142337"/><text x="94" y="646" fill="#83baff" font-size="31" font-weight="700">측정 조건과 해석</text><text x="94" y="692" fill="#edf3fb" font-size="24" font-weight="400">Apple M5 Pro · macOS arm64 · ONNX Runtime / CoreML + CPU · 2026-11-06 검증 기록</text><text x="94" y="735" fill="#edf3fb" font-size="24" font-weight="400">카메라 실운동 FPS 보장치가 아닙니다. 모든 연산이 GPU 또는 Neural Engine에서 실행된다는 뜻도 아닙니다.</text><line x1="64" y1="818" x2="1536" y2="818" stroke="#2b3e54" stroke-width="1" stroke-linecap="round"/>
