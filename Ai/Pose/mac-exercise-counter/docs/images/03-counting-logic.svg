    <text x="64" y="59" fill="#78e5b1" font-size="20" font-weight="700">LOCAL MOTION  /  IMPLEMENTATION</text>
    <text x="64" y="128" fill="#edf3fb" font-size="48" font-weight="700">동작의 순서를 기억해 완전한 반복을 센다</text><text x="64" y="177" fill="#a5b7cd" font-size="24" font-weight="400">준비 → 굽힘 → 복귀를 시간에 따라 확인하는 상태 머신을 구현했습니다.</text>
    <rect x="64" y="270" width="464" height="225" rx="20" fill="#142337"/><text x="92" y="327" fill="#78e5b1" font-size="34" font-weight="700">준비 자세 확인</text><text x="92" y="388" fill="#edf3fb" font-size="28" font-weight="400">팔 또는 다리를 편 자세</text><text x="92" y="437" fill="#edf3fb" font-size="28" font-weight="400">0.25초 유지</text><rect x="568" y="270" width="464" height="225" rx="20" fill="#142337"/><text x="596" y="327" fill="#78e5b1" font-size="34" font-weight="700">준비 완료</text><text x="596" y="388" fill="#edf3fb" font-size="28" font-weight="400">굽힘 조건을 확인</text><text x="596" y="437" fill="#edf3fb" font-size="28" font-weight="400">0.16초 유지</text><rect x="1072" y="270" width="464" height="225" rx="20" fill="#142337"/><text x="1100" y="327" fill="#78e5b1" font-size="34" font-weight="700">굽힘 확인</text><text x="1100" y="388" fill="#edf3fb" font-size="28" font-weight="400">다시 편 자세로 복귀</text><text x="1100" y="437" fill="#edf3fb" font-size="28" font-weight="400">0.20초 유지 후 +1</text><text x="535" y="392" fill="#83baff" font-size="31" font-weight="400">→</text><text x="1039" y="392" fill="#83baff" font-size="31" font-weight="400">→</text><line x1="1304" y1="511" x2="1304" y2="551" stroke="#83baff" stroke-width="3" stroke-linecap="round"/><line x1="1304" y1="551" x2="800" y2="551" stroke="#83baff" stroke-width="3" stroke-linecap="round"/><text x="788" y="565" fill="#83baff" font-size="31" font-weight="400">↑</text><text x="890" y="588" fill="#83baff" font-size="23" font-weight="400">+1 이후 준비 상태로 돌아가 다음 반복을 대기</text><rect x="64" y="625" width="1472" height="144" rx="20" fill="#142337"/><text x="90" y="672" fill="#ffcd85" font-size="28" font-weight="700">잘못된 누적을 막는 조건</text><text x="90" y="714" fill="#edf3fb" font-size="24" font-weight="400">필수 관절 손실·추적 손실·일시정지 → 미완료 반복 취소, 기존 횟수 보존</text><text x="90" y="751" fill="#edf3fb" font-size="24" font-weight="400">초기 굽힘·작은 떨림·얕은 동작은 완전한 반복으로 세지 않음 · 최소 반복 시간 0.65초</text><line x1="64" y1="818" x2="1536" y2="818" stroke="#2b3e54" stroke-width="1" stroke-linecap="round"/>
    <text x="64" y="855" fill="#a5b7cd" font-size="19" font-weight="400">근거: counter.py / RepMachine · config.json / timing  |  수치는 조정 가능한 구현 초기값</text><text x="1420" y="855" fill="#a5b7cd" font-size="19" font-weight="400">2026.11.11</text>
