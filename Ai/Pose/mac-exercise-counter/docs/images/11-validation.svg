    <text x="64" y="59" fill="#78e5b1" font-size="20" font-weight="700">LOCAL MOTION  /  IMPLEMENTATION</text>
    <text x="64" y="128" fill="#edf3fb" font-size="48" font-weight="700">어디까지 검증했는가</text><text x="64" y="177" fill="#a5b7cd" font-size="24" font-weight="400">카운터 자동 테스트와 실제 운동 영상 검증을 구분했습니다.</text>
    <rect x="64" y="226" width="1472" height="110" rx="20" fill="#142337"/><text x="90" y="290" fill="#78e5b1" font-size="42" font-weight="700">81개 자동 테스트 통과</text><text x="790" y="286" fill="#a5b7cd" font-size="27" font-weight="400">현재 코드 재실행: 2026-11-11</text><text x="90" y="395" fill="#edf3fb" font-size="25" font-weight="400">상체 덤벨 컬</text><text x="588" y="395" fill="#78e5b1" font-size="26" font-weight="600">왼팔 1회 / 오른팔 1회</text><text x="1110" y="395" fill="#a5b7cd" font-size="21" font-weight="400">실제 덤벨 영상</text><text x="90" y="460" fill="#edf3fb" font-size="25" font-weight="400">한쪽 팔 컬</text><text x="588" y="460" fill="#78e5b1" font-size="26" font-weight="600">보이는 왼팔 1회 / 반대팔 0회</text><text x="1110" y="460" fill="#a5b7cd" font-size="21" font-weight="400">같은 영상의 부분 촬영 버전</text><text x="90" y="525" fill="#edf3fb" font-size="25" font-weight="400">한쪽 다리 스쿼트</text><text x="588" y="525" fill="#78e5b1" font-size="26" font-weight="600">4회 · 313/313 프레임 추적</text><text x="1110" y="525" fill="#a5b7cd" font-size="21" font-weight="400">정면 설정</text><text x="90" y="590" fill="#edf3fb" font-size="25" font-weight="400">상체 팔굽혀펴기</text><text x="588" y="590" fill="#78e5b1" font-size="26" font-weight="600">5회</text><text x="1110" y="590" fill="#a5b7cd" font-size="21" font-weight="400">전신 자세 판정은 보류</text><text x="90" y="655" fill="#edf3fb" font-size="25" font-weight="400">정지 영상 + 작은 흔들림</text><text x="588" y="655" fill="#78e5b1" font-size="26" font-weight="600">0회</text><text x="1110" y="655" fill="#a5b7cd" font-size="21" font-weight="400">±2px 영상 흔들림 대조군</text><text x="90" y="720" fill="#edf3fb" font-size="25" font-weight="400">전신 정면 스쿼트</text><text x="588" y="720" fill="#ffcd85" font-size="26" font-weight="600">4회 중 3회 · 1회 누락</text><text x="1110" y="720" fill="#a5b7cd" font-size="21" font-weight="400">남은 실패 사례도 기록</text><text x="70" y="789" fill="#a5b7cd" font-size="24" font-weight="400">공개 실제 영상과 파생 영상에 대한 표본 검증입니다. 일반 환경의 정확도 %를 산출한 결과는 아닙니다.</text><line x1="64" y1="818" x2="1536" y2="818" stroke="#2b3e54" stroke-width="1" stroke-linecap="round"/>
