<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="1600" height="900" fill="#0b121d"/>
    <g font-family="Apple SD Gothic Neo">
    <text x="64" y="59" fill="#78e5b1" font-size="20" font-weight="700">LOCAL MOTION  /  IMPLEMENTATION</text>
    <text x="64" y="128" fill="#edf3fb" font-size="48" font-weight="700">한쪽 다리 스쿼트의 중복 탐지 문제 해결</text><text x="64" y="177" fill="#a5b7cd" font-size="24" font-weight="400">같은 528 × 1076 영상 313프레임 · 정면 설정 · 자동 추적 및 수동 영역 모두 비교</text>
    <rect x="64" y="242" width="690" height="319" rx="20" fill="#142337"/><rect x="790" y="242" width="746" height="319" rx="20" fill="#142337"/><text x="94" y="295" fill="#a5b7cd" font-size="30" font-weight="700">수정 전</text><text x="94" y="397" fill="#ffcd85" font-size="64" font-weight="700">2회에서 중단</text><text x="94" y="458" fill="#edf3fb" font-size="28" font-weight="400">같은 한 다리에 박스가 2개 발생</text><text x="94" y="505" fill="#edf3fb" font-size="28" font-weight="400">서로 다른 사람의 겹침으로 처리</text><text x="820" y="295" fill="#78e5b1" font-size="30" font-weight="700">수정 후</text><text x="820" y="397" fill="#78e5b1" font-size="64" font-weight="700">4회 완료</text><text x="820" y="458" fill="#edf3fb" font-size="28" font-weight="400">313 / 313 프레임 같은 대상 추적</text><text x="820" y="505" fill="#edf3fb" font-size="28" font-weight="400">대상 ID 1 · 오른쪽 다리 유지</text><rect x="64" y="596" width="1472" height="174" rx="20" fill="#142337"/><text x="94" y="645" fill="#83baff" font-size="31" font-weight="700">중복이라고 확인된 박스만 제외</text><text x="94" y="694" fill="#edf3fb" font-size="25" font-weight="400">박스 겹침 + 화면 경계 + 현재 관절 일치 + 이전 대상과의 움직임 연속성을 함께 확인</text><text x="94" y="736" fill="#edf3fb" font-size="25" font-weight="400">별도 인물 기록이나 불확실한 관측이 있으면 보류합니다. 다른 사람으로 자동 전환하지 않습니다.</text><line x1="64" y1="818" x2="1536" y2="818" stroke="#2b3e54" stroke-width="1" stroke-linecap="round"/>
