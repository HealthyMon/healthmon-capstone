services:
  generation3d:
    image: ${HEALTHMON_IMAGE:-healthmon-3d:3090}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAX_JOBS: ${MAX_JOBS:-4}
    gpus: all
    user: "${HEALTHMON_UID:-1000}:${HEALTHMON_GID:-1000}"
    working_dir: /opt/healthmon/Ai/Generation3D
    volumes:
      - .:/opt/healthmon/Ai/Generation3D
    environment:
      HEALTHMON_QWEN_MEMORY_MODE: ${HEALTHMON_QWEN_MEMORY_MODE:-cuda}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    shm_size: 8gb
    stdin_open: true
    tty: true
