name: Common server CPU and PostgreSQL
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: healthmon_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U healthmon_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Server/requirements.txt pytest==9.0.2
      - run: python -m pytest Server/tests -q
        env:
          TEST_ADMIN_DSN: postgresql://healthmon_test:isolated-ci-only@localhost:5432/postgres
